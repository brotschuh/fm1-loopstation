# Builds the Ouroloops firmware with M-VAVE's build script and JieLi's Windows toolchain 2.5.3,
# then publishes its flash page at docs/firmware/ (GitHub Pages).
name: firmware

on:
  push:
    branches: [main]
    paths: ['firmware/**', 'tools/make_flash_page.py', '.github/workflows/firmware.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: firmware
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: JieLi toolchain 2.5.3
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $want = 'd4bc97cf421c1ccc373dd8924ce88720ff7457b3f1478d15df4aeda6ae923bce'   # pi32/bin/clang.exe (firmware/README.md)
          curl.exe -fL --retry 4 --retry-delay 10 -o jl-2.5.3.exe https://jl-update.oss-cn-shenzhen.aliyuncs.com/2.5.3.exe
          Write-Host ('installer sha256 ' + (Get-FileHash jl-2.5.3.exe).Hash + ', ' + (Get-Item jl-2.5.3.exe).Length + ' bytes')
          function Find-Pi32($dirs) {
            foreach ($d in $dirs) {
              if (!(Test-Path $d)) { continue }
              foreach ($c in Get-ChildItem $d -Recurse -Filter clang.exe -ErrorAction SilentlyContinue) {
                if ((Get-FileHash $c.FullName).Hash.ToLower() -eq $want) { return (Split-Path (Split-Path $c.FullName)) }
              }
            }
            return $null
          }
          # The installer is Inno Setup: unpack it with innoextract (no installer run, no dialogs).
          curl.exe -fL --retry 4 -o innoextract.zip https://github.com/dscharrer/innoextract/releases/download/1.9/innoextract-1.9-windows.zip
          Expand-Archive innoextract.zip -DestinationPath ie -Force
          $ie = (Get-ChildItem ie -Recurse -Filter innoextract.exe | Select-Object -First 1).FullName
          & $ie --version
          & $ie -e -s -d jl jl-2.5.3.exe 2>&1 | Select-Object -Last 15
          $pi32 = Find-Pi32 @("$PWD\jl")
          if (!$pi32) {
            # fall back: run it silently with a log, at most 8 minutes, then show the log
            $p = Start-Process .\jl-2.5.3.exe -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP- /NOICONS /DIR=C:\JL /LOG=C:\jl-setup.log' -PassThru
            if (!$p.WaitForExit(480000)) { Write-Host 'installer still running after 8 min, stopping it'; $p.Kill() }
            if (Test-Path C:\jl-setup.log) { Write-Host '--- setup log (end) ---'; Get-Content C:\jl-setup.log -Tail 40 }
            Get-Process | Where-Object { $_.StartTime -gt (Get-Date).AddMinutes(-10) } | Select-Object -First 15 | ForEach-Object { Write-Host ('process ' + $_.ProcessName) }
            $pi32 = Find-Pi32 @('C:\JL', "$PWD\jl")
          }
          if (!$pi32) {
            Write-Host 'clang.exe found:'
            foreach ($d in @("$PWD\jl", 'C:\JL')) { if (Test-Path $d) { Get-ChildItem $d -Recurse -Filter clang.exe -ErrorAction SilentlyContinue | ForEach-Object { Write-Host ($_.FullName + ' ' + (Get-FileHash $_.FullName).Hash) } } }
            Write-Host 'unpacked:'; Get-ChildItem jl -Recurse -Depth 2 -ErrorAction SilentlyContinue | Select-Object -First 60 | ForEach-Object { $_.FullName }
            throw 'pi32 toolchain with the expected clang.exe not found'
          }
          Write-Host "toolchain: $pi32"
          "FM1_PI32_TOOLCHAIN=$pi32" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Build the firmware (M-VAVE's sdk/Build.ps1)
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File firmware\sdk\Build.ps1 -FirmwareOnly -Toolchain $env:FM1_PI32_TOOLCHAIN

      - name: Flash page
        run: python tools/make_flash_page.py firmware docs/firmware/index.html https://github.com/brotschuh/ouroloops

      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            firmware/build/dx7/generated/FM1_OFFICIAL_OPEN.fwsc
            firmware/build/dx7/firmware-report.json
            firmware/build/dx7/package-report.json
            docs/firmware/index.html

      - name: Publish the flash page
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/firmware/index.html
          git diff --cached --quiet && exit 0
          git commit -m "Firmware flash page for ${GITHUB_SHA::7} (built by the firmware workflow)"
          git pull --rebase origin main
          git push origin HEAD:main
